<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>研究人員端 | 匿名語音研究平台</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="brand">
      <img src="../assets/research-mark.svg" width="40" height="40" alt="">
      <div><strong>匿名語音研究平台</strong><span>研究人員端</span></div>
    </div>
    <nav class="admin-nav" aria-label="研究者後台分頁">
      <button class="nav-tab active" data-view="submissions">提交審核</button>
      <button class="nav-tab" data-view="researchers">研究者管理</button>
      <button class="nav-tab" data-view="tasks">題目與音檔</button>
    </nav>
    <a class="export-button" href="../admin/api/exports.csv" download>下載 CSV</a>
  </header>

  <main class="admin-shell">
    <section class="admin-view active" data-panel="submissions">
    <section class="page-heading">
      <div><p>研究資料管理</p><h1>提交與資格審核</h1></div>
      <button id="refresh" type="button" title="重新整理" aria-label="重新整理">↻</button>
    </section>

    <div id="alert" class="alert" role="alert" hidden></div>

    <section id="collection-control" class="collection-control" aria-label="研究收件控制">
      <div class="control-copy">
        <strong id="collection-state">正在讀取收件狀態…</strong>
        <span id="collection-count">目前收件數與剩餘名額將顯示於此。</span>
      </div>
      <form id="collection-form" class="control-form">
        <label>最高收錄數量<input name="max_submissions" type="number" min="1" max="100000" required></label>
        <button type="submit">儲存上限</button>
        <button id="toggle-collection" class="close-study" type="button">立即關閉收件</button>
      </form>
    </section>

    <section class="metrics" aria-label="提交摘要">
      <article><span>全部提交</span><strong id="metric-total">—</strong></article>
      <article><span>已完成</span><strong id="metric-completed">—</strong></article>
      <article><span>進行中</span><strong id="metric-progress">—</strong></article>
      <article><span>待資格審核</span><strong id="metric-pending">—</strong></article>
    </section>

    <section class="workspace">
      <div class="list-pane">
        <div class="toolbar">
          <h2>匿名提交</h2>
          <select id="status-filter" aria-label="依狀態篩選">
            <option value="">全部狀態</option>
            <option value="completed">已完成</option>
            <option value="in_progress">進行中</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>匿名編號</th><th>狀態</th><th>第一語言</th><th>資格審核</th><th>提交時間</th></tr></thead>
            <tbody id="submission-rows"><tr><td colspan="5" class="empty">正在載入…</td></tr></tbody>
          </table>
        </div>
      </div>

      <aside id="detail-pane" class="detail-pane">
        <div class="empty-detail"><strong>選擇一筆匿名提交</strong><span>查看背景資料、去識別化錄音及資格審核。</span></div>
      </aside>
    </section>
    </section>

    <section class="admin-view" data-panel="researchers">
      <section class="page-heading"><div><p>存取權限</p><h1>研究者管理</h1></div><button id="revoke-all" class="danger-button" type="button">撤銷所有其他研究者</button></section>
      <div id="researcher-alert" class="alert" role="alert" hidden></div>
      <section class="management-layout">
        <form id="researcher-form" class="management-form">
          <h2>新增研究者</h2>
          <label>研究者 email<input name="email" type="email" required placeholder="researcher@example.edu"></label>
          <label>權限<select name="role"><option value="researcher">研究者</option><option value="manager">管理者</option></select></label>
          <button type="submit">新增研究者</button>
          <p class="form-note">Cloudflare 帳戶持有人為不可停用、不可移除的最高權限擁有者。</p>
        </form>
        <div class="management-table"><div class="toolbar"><h2>專案使用者</h2><button id="refresh-researchers" type="button" title="重新整理">↻</button></div><div class="table-wrap"><table><thead><tr><th>Email</th><th>角色</th><th>狀態</th><th>操作</th></tr></thead><tbody id="researcher-rows"><tr><td colspan="4" class="empty">正在載入…</td></tr></tbody></table></div></div>
      </section>
    </section>

    <section class="admin-view" data-panel="tasks">
      <section class="page-heading"><div><p>研究內容</p><h1>題目與問題音檔</h1></div><div class="heading-actions"><button id="new-task" type="button">新增題目</button><button id="publish-tasks" type="button">發布到受試者端</button></div></section>
      <div id="task-alert" class="alert" role="alert" hidden></div>
      <section class="management-layout task-layout">
        <div class="management-table"><div class="toolbar"><h2>題目草稿</h2><span id="publish-status" class="status-text">尚未載入</span></div><div id="task-list" class="task-list"><p class="empty">正在載入…</p></div></div>
        <form id="task-form" class="management-form" hidden>
          <h2>編輯題目</h2>
          <input name="task_id" type="hidden">
          <label>題目名稱<input name="title" required maxlength="100"></label>
          <label>題目文字<textarea name="prompt_text" required rows="4"></textarea></label>
          <label>研究指示<textarea name="research_instructions" required rows="3"></textarea></label>
          <div class="field-row"><label>最多播放次數<input name="max_playbacks" type="number" min="1" max="2" value="2" required></label><label>最多錄音次數<input name="max_recordings" type="number" min="1" max="2" value="2" required></label></div>
          <label>問題音檔（MP3 或 WAV）<input name="audio" type="file" accept="audio/mpeg,audio/wav,.mp3,.wav"></label>
          <audio id="task-audio-preview" controls preload="none" hidden></audio>
          <div class="form-actions"><button type="submit">儲存草稿</button><button id="delete-task" class="danger-button" type="button">刪除題目</button></div>
        </form>
      </section>
    </section>
  </main>

  <template id="detail-template">
    <div class="detail-header"><div><span>匿名提交</span><strong data-field="id"></strong></div><button id="close-detail" aria-label="關閉詳細資料" title="關閉">×</button></div>
    <dl class="profile-grid">
      <div><dt>狀態</dt><dd data-field="status"></dd></div><div><dt>年齡</dt><dd data-field="age_group"></dd></div>
      <div><dt>生理性別</dt><dd data-field="biological_sex"></dd></div><div><dt>國籍</dt><dd data-field="nationality"></dd></div>
      <div><dt>第一語言</dt><dd data-field="first_language"></dd></div><div><dt>華語學習年數</dt><dd data-field="mandarin_learning_years"></dd></div>
    </dl>
    <section><h3>去識別化錄音</h3><div id="recordings" class="recordings"></div></section>
    <form id="review-form" class="review-form">
      <h3>第一語言資格審核</h3>
      <label>審核結果<select name="eligibility_status" required><option value="">請選擇</option><option value="eligible">符合</option><option value="ineligible">不符合</option><option value="undetermined">無法判定</option></select></label>
      <label>研究備註<textarea name="notes" rows="3" maxlength="1000" placeholder="只記錄研究判定，不輸入身分猜測。"></textarea></label>
      <button type="submit">儲存審核結果</button>
    </form>
  </template>
  <script type="module" src="./admin.js"></script>
</body>
</html>
